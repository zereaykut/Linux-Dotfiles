# See https://wiki.hyprland.org/Configuring/Window-Rules/

windowrule = float true, match:class ^(vlc)$, match:title ^(.*VLSub.*)$                                                                            # Make float vlc VLSub
windowrule = float true, match:class ^(vlc)$, match:title ^(Current Media Information)$                                                               # Make float vlc Current Media Information
windowrule = float true, match:class ^(blueman-manager)$                                                                                       # Make float blueman
windowrule = float true, match:class ^(steam)$, match:title ^(Friends List)$                                                                          # Make float Steam Friends List
windowrule = float true, match:class ^(steam)$, match:title ^(Steam - News)$                                                                          # Make float Steam News
windowrule = float true, match:class ^(steam)$, match:title ^(Steam Settings)$                                                                        # Make float Steam Settings
windowrule = float true, match:class ^(org.qbittorrent.qBittorrent)$, match:title ^(Preferences)$                                                     # Make float Qbittorrent Settings
windowrule = float true, match:class ^(qalculate-gtk)$, match:title ^(Qalculate!)$                                                                    # Make float Qalculate
windowrule = float true, match:class ^(org.kde.dolphin)$, match:title ^(Moving — Dolphin)$                                                            # Make float Dolphin Move Window
windowrule = float true, match:class ^(org.kde.dolphin)$, match:title ^(Copying — Dolphin)$                                                           # Make float Dolphin Copy/Paste Window
windowrule = float true, match:class ^(org.kde.dolphin)$, match:title ^(Progress Dialog — Dolphin)$
windowrule = float true, match:class ^(firefox)$, match:title ^(About Mozilla Firefox)$
windowrule = float true, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = float true, match:class ^(firefox)$, match:title ^(Library)$
windowrule = float true, match:class ^(firefox)$, match:title ^(.*Bitwarden.*)$
windowrule = float true, match:class ^(io.missioncenter.MissionCenter)$, match:title ^(Mission Center)$
windowrule = float true, match:class ^(qt5ct)$
windowrule = float true, match:class ^(qt6ct)$
windowrule = float true, match:class ^(nwg-look)$
windowrule = float true, match:class ^(nwg-displays)$
windowrule = float true, match:class ^(kvantummanager)$
windowrule = float true, match:class ^(org.kde.ark)$
windowrule = float true, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float true, match:class ^(nm-applet)$
windowrule = float true, match:class ^(nm-connection-editor)$
windowrule = float true, match:class ^(org.gnome.NetworkDisplays)$
windowrule = float true, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float true, match:class ^(it.mijorus.smile)$
windowrule = float true, match:class ^(soffice)$

# common modals
windowrule = float true, match:title ^(Open File)$
windowrule = float true, match:title ^(Choose Files)$
windowrule = float true, match:title ^(Save As)$
windowrule = float true, match:title ^(Confirm to replace files)$
windowrule = float true, match:title ^(File Operation Progress)$
windowrule = float true, match:class ^(xdg-desktop-portal-gtk)$

