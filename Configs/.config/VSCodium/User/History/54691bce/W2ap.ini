
[command]
binding_terminal = <super> KEY_ENTER
command_terminal = kitty
binding_file_manager = <super> <shift> KEY_E
command_file_manager = dolphin
binding_lock = <super> KEY_L
command_lock = hyprlock
binding_logout_big = <super> KEY_ESC
command_logout_big = $SOURCE_PATH/launch_logout.sh  1
binding_logout_small = <super> KEY_BACKSPACE
command_logout_small = $SOURCE_PATH/launch_logout.sh  2

# Launcher
binding_launcher_small = <super> <space>
command_launcher_small = $SOURCE_PATH/launcher.sh 1
binding_launcher_big = <super> KEY_A
command_launcher_big = $SOURCE_PATH/launcher.sh 2

# Volume
binding_mute = KEY_MUTE
command_mute = swayosd-client --output-volume mute-toggle
binding_mic_mute = <shift> KEY_MUTE
command_mic_mute = swayosd-client --output-volume mute-toggle
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = swayosd-client --output-volume -5
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = swayosd-client --output-volume 5
repeatable_binding_input_volume_down = <shift> KEY_VOLUMEDOWN
command_input_volume_down = swayosd-client --input-volume -5
repeatable_binding_input_volume_up = <shift> KEY_VOLUMEUP
command_input_volume_up = swayosd-client --input-volume 5

# Brightness
repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = swayosd-client --brightness -5
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = swayosd-client --brightness +5

[vswitch]
binding_0 = <super> KEY_0
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
binding_6 = <super> KEY_6
binding_7 = <super> KEY_7
binding_8 = <super> KEY_8
binding_9 = <super> KEY_9