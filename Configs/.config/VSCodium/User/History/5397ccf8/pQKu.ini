### ======================
###  AUTOSTART
### ======================
[autostart]
exec = $HOME/.local/share/bin/autostart.sh


### ======================
###  INPUT
### ======================
[input]
xkb_layout = tr,us


### ======================
###  OUTPUTS
### ======================
[output:eDP-1]
mode = 1920x1080@60000
position = 0,0
transform = normal
scale = 1.0

[output:HDMI-A-1]
mode = 1920x1080@60000
transform = normal


### ======================
###  CORE
### ======================
[core]
close_top_view = <super> KEY_Q | <alt> KEY_F4
vwidth = 3
vheight = 3
preferred_decoration_mode = client


### ======================
###  MOVE / RESIZE / ZOOM / EFFECTS
### ======================
[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[zoom]
modifier = <super>

[alpha]
modifier = <super> <alt>

[wrot]
activate = <super> <ctrl> BTN_RIGHT

[fisheye]
toggle = <super> <ctrl> KEY_F


### ======================
###  COMMANDS
### ======================
[command]
binding_terminal = <super> KEY_ENTER
command_terminal = kitty

binding_file_manager = <super> <shift> KEY_E
command_file_manager = dolphin

binding_lock = <super> KEY_L
command_lock = hyprlock

binding_logout_big = <super> KEY_ESC
command_logout_big = /home/YOURUSER/.config/wayfire/launch_logout.sh 1

binding_logout_small = <super> KEY_BACKSPACE
command_logout_small = /home/YOURUSER/.config/wayfire/launch_logout.sh 2

binding_launcher_small = <super> <space>
command_launcher_small = /home/YOURUSER/.config/wayfire/launcher.sh 1

binding_launcher_big = <super> KEY_A
command_launcher_big = /home/YOURUSER/.config/wayfire/launcher.sh 2

binding_mute = KEY_MUTE
command_mute = swayosd-client --output-volume mute-toggle

binding_mic_mute = <shift> KEY_MUTE
command_mic_mute = swayosd-client --input-volume mute-toggle

repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = swayosd-client --output-volume -5

repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = swayosd-client --output-volume 5

repeatable_binding_input_volume_down = <shift> KEY_VOLUMEDOWN
command_input_volume_down = swayosd-client --input-volume -5

repeatable_binding_input_volume_up = <shift> KEY_VOLUMEUP
command_input_volume_up = swayosd-client --input-volume 5

repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = swayosd-client --brightness -5

repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = swayosd-client --brightness +5

binding_screenshot = KEY_PRINT
command_screenshot = grim - | swappy -f -

binding_screenshot_interactive = <shift> KEY_PRINT
command_screenshot_interactive = grim -g "$(slurp)" - | swappy -f -


### ======================
###  WORKSPACE SWITCHING (all merged)
### ======================
[vswitch]
binding_0 = <super> KEY_0
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
binding_6 = <super> KEY_6
binding_7 = <super> KEY_7
binding_8 = <super> KEY_8
binding_9 = <super> KEY_9

binding_left  = <ctrl> <super> KEY_LEFT
binding_down  = <ctrl> <super> KEY_DOWN
binding_up    = <ctrl> <super> KEY_UP
binding_right = <ctrl> <super> KEY_RIGHT

with_win_left  = <ctrl> <super> <shift> KEY_LEFT
with_win_down  = <ctrl> <super> <shift> KEY_DOWN
with_win_up    = <ctrl> <super> <shift> KEY_UP
with_win_right = <ctrl> <super> <shift> KEY_RIGHT


### ======================
###  APPLICATION SWITCHERS
### ======================
[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[fast-switcher]
activate = <alt> KEY_ESC


### ======================
###  CUBE / EXPO / OSWITCH / INVERT
### ======================
[cube]
activate = <ctrl> <alt> BTN_LEFT

[expo]
toggle = <super> KEY_E
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
select_workspace_5 = KEY_5
select_workspace_6 = KEY_6
select_workspace_7 = KEY_7
select_workspace_8 = KEY_8
select_workspace_9 = KEY_9

[oswitch]
next_output = <super> KEY_O
next_output_with_win = <super> <shift> KEY_O

[invert]
toggle = <super> KEY_I
