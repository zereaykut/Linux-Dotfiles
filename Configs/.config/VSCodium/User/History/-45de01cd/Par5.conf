# See https://wiki.hyprland.org/Configuring/Window-Rules/

windowrulev2 = float true, match:class ^(vlc)$,title ^(.*VLSub.*)$                                                                            # Make float vlc VLSub
windowrulev2 = float true, match:class ^(vlc)$,title ^(Current Media Information)$                                                               # Make float vlc Current Media Information
windowrulev2 = float true, match:class ^(blueman-manager)$                                                                                       # Make float blueman
windowrulev2 = float true, match:class ^(steam)$,title ^(Friends List)$                                                                          # Make float Steam Friends List
windowrulev2 = float true, match:class ^(steam)$,title ^(Steam - News)$                                                                          # Make float Steam News
windowrulev2 = float true, match:class ^(steam)$,title ^(Steam Settings)$                                                                        # Make float Steam Settings
windowrulev2 = float true, match:class ^(org.qbittorrent.qBittorrent)$,title ^(Preferences)$                                                     # Make float Qbittorrent Settings
windowrulev2 = float true, match:class ^(qalculate-gtk)$,title ^(Qalculate!)$                                                                    # Make float Qalculate
windowrulev2 = float true, match:class ^(org.kde.dolphin)$,title ^(Moving — Dolphin)$                                                            # Make float Dolphin Move Window
windowrulev2 = float true, match:class ^(org.kde.dolphin)$,title ^(Copying — Dolphin)$                                                           # Make float Dolphin Copy/Paste Window
windowrulev2 = float true, match:class ^(org.kde.dolphin)$,title ^(Progress Dialog — Dolphin)$
windowrulev2 = float true, match:class ^(firefox)$,title ^(About Mozilla Firefox)$
windowrulev2 = float true, match:class ^(firefox)$,title ^(Picture-in-Picture)$
windowrulev2 = float true, match:class ^(firefox)$,title ^(Library)$
windowrulev2 = float true, match:class ^(firefox)$,title ^(.*Bitwarden.*)$
windowrulev2 = float true, match:class ^(io.missioncenter.MissionCenter)$,title ^(Mission Center)$
windowrulev2 = float true, match:class ^(qt5ct)$
windowrulev2 = float true, match:class ^(qt6ct)$
windowrulev2 = float true, match:class ^(nwg-look)$
windowrulev2 = float true, match:class ^(nwg-displays)$
windowrulev2 = float true, match:class ^(kvantummanager)$
windowrulev2 = float true, match:class ^(org.kde.ark)$
windowrulev2 = float true, match:class ^(org.pulseaudio.pavucontrol)$
windowrulev2 = float true, match:class ^(nm-applet)$
windowrulev2 = float true, match:class ^(nm-connection-editor)$
windowrulev2 = float true, match:class ^(org.gnome.NetworkDisplays)$
windowrulev2 = float true, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float true, match:class ^(it.mijorus.smile)$
windowrulev2 = float true, match:class ^(soffice)$

# common modals
windowrulev2 = float true, match:title ^(Open File)$
windowrulev2 = float true, match:title ^(Choose Files)$
windowrulev2 = float true, match:title ^(Save As)$
windowrulev2 = float true, match:title ^(Confirm to replace files)$
windowrulev2 = float true, match:title ^(File Operation Progress)$
windowrulev2 = float true, match:class ^(xdg-desktop-portal-gtk)$

